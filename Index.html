<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão Acadêmica</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1> MANUTENÇÃO DE USUÁRIOS DO SISTEMA INTERNO </h1>
    <MAIN>
        <form action="" method="post">
    Login <input type="text"> <br>
<br>
    Senha <input type="password"> <br>
<br>
    Status <select>
        <option>Inativo</option>
        <option>Ativo</option>
    </select> <br>
<br>
    Tipo <input type="radio"name="Tipo"> Técnico
    <input type="radio"name="Tipo"> Professor
    <input type="radio"name="Tipo"> Aluno <br>
    <br>
    Data de criação <input type="datetime-local"> <br>
    <br>
    Observações <input type="text"> <br>
    <br>
    Módulos <input type="checkbox"> Compras
    <input type="checkbox"> Biblioteca
    <input type="checkbox"> Acadêmico
    <br>
    <input type="checkbox"> Documentação
    <input type="checkbox"> Recursos Humanos
    <br>
    <br>
    <button>Cadastrar</button>
    <button>Excluir</button>
        </form>
    </MAIN>

</body>
</html>
